<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>🚆 GSM-R Funk Simulation</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      text-align: center;
      padding-top: 50px;
    }
    h2 { color: #0f172a; }
    button {
      padding: 12px 24px;
      margin: 10px;
      font-size: 1.1rem;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:hover { transform: scale(1.05); }
    #fdl { background-color: #2563eb; color: white; }
    #lf { background-color: #16a34a; color: white; }
    #mute { background-color: #f59e0b; color: black; display: none; }
    #status { margin-top: 20px; font-weight: bold; }
  </style>
</head>
<body>
  <h2>🚆 GSM-R Funk Simulation</h2>
  <p>Wähle deine Rolle:</p>
  <button id="fdl">🧑‍✈️ Fahrdienstleiter</button>
  <button id="lf">🚂 Lokführer</button>
  <button id="mute">🔇 Mute</button>

  <p id="status">Noch keine Verbindung.</p>

  <script>
    const ws = new WebSocket("ws://localhost:8080");
    let pc, localStream, role, isMuted = false;
    const room = "GSMR"; // Fester Raumname

    async function startCall() {
      pc = new RTCPeerConnection({ iceServers: [{ urls: "stun:stun.l.google.com:19302" }] });
      localStream = await navigator.mediaDevices.getUserMedia({
       audio: {
        noiseSuppression: true, // Geräuschunterdrückung aktiv
        echoCancellation: true, // Echo-Unterdrückung
       autoGainControl: true   // Automatische Verstärkungsregelung
       }
      });


      // Lokales Audio optional hörbar machen (zu Testzwecken)
      const localAudio = document.createElement("audio");
      localAudio.srcObject = localStream;
      localAudio.autoplay = true;
      localAudio.muted = true;
      document.body.appendChild(localAudio);

      localStream.getTracks().forEach(t => pc.addTrack(t, localStream));

      const remoteAudio = document.createElement("audio");
      remoteAudio.autoplay = true;
      pc.ontrack = (e) => (remoteAudio.srcObject = e.streams[0]);
      document.body.appendChild(remoteAudio);

      pc.onicecandidate = (e) => {
        if (e.candidate) {
          ws.send(JSON.stringify({ type: "signal", room, payload: { candidate: e.candidate } }));
        }
      };
    }

    ws.onmessage = async (event) => {
      const msg = JSON.parse(event.data);

      if (msg.type === "ready") {
        document.getElementById("status").textContent = "🔄 Verbindung wird aufgebaut...";
        if (role === "lokführer") {
          // Lokführer startet das Angebot
          const offer = await pc.createOffer();
          await pc.setLocalDescription(offer);
          ws.send(JSON.stringify({ type: "signal", room, payload: { sdp: offer } }));
        }
      }

      if (msg.type === "signal") {
        const { sdp, candidate } = msg.payload;
        if (sdp) {
          await pc.setRemoteDescription(new RTCSessionDescription(sdp));
          if (sdp.type === "offer" && role === "fahrdienstleiter") {
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
            ws.send(JSON.stringify({ type: "signal", room, payload: { sdp: answer } }));
          } else if (sdp.type === "answer") {
            document.getElementById("status").textContent = "✅ Funkverbindung aktiv";
            document.getElementById("mute").style.display = "inline-block";
          }
        } else if (candidate) {
          await pc.addIceCandidate(new RTCIceCandidate(candidate));
        }
      }
    };

    async function joinAs(selectedRole) {
      role = selectedRole;
      document.getElementById("status").textContent = `👋 Rolle gewählt: ${role}`;
      await startCall();
      ws.send(JSON.stringify({ type: "join", room }));
    }

    document.getElementById("fdl").onclick = () => joinAs("fahrdienstleiter");
    document.getElementById("lf").onclick = () => joinAs("lokführer");

    document.getElementById("mute").onclick = () => {
      isMuted = !isMuted;
      localStream.getAudioTracks()[0].enabled = !isMuted;
      document.getElementById("mute").textContent = isMuted ? "🎙️ Unmute" : "🔇 Mute";
    };
  </script>
</body>
</html>
