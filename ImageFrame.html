<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Frame + Push-to-Talk</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .image-container {
    position: relative;
    display: inline-block;
  }

  img {
    display: block;
    max-width: 100%;
    height: auto;
  }

  .overlay-btn {
    position: absolute;
    background-color: rgba(37, 99, 235, 0.85);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 8px 16px;
    font-size: 14px;
    cursor: pointer;
    transition: 0.2s;
    user-select: none;
  }
  .overlay-btn:hover { background-color: rgba(59,130,246,1); transform: scale(1.05); }
  .overlay-btn:disabled { background-color: rgba(100,100,100,0.5); cursor: not-allowed; transform: none; }
  #btn-close { top: 10px; right: 10px; }
  #btn-action { bottom: 225px; left: 49px; }
</style>
</head>
<body>
  <div class="image-container">
    <img id="displayImage" alt="Bild">
    <button class="overlay-btn" id="btn-close">✕</button>
    <button class="overlay-btn" id="btn-action">🎙️</button>
  </div>

<script>
  // --- Bild laden ---
  const params = new URLSearchParams(window.location.search);
  const src = params.get('src');
  const img = document.getElementById('displayImage');
  if (src) img.src = src;
  else document.body.innerHTML = '<p style="color:white">Kein Bild angegeben.</p>';

  // --- Button schließen ---
  document.getElementById('btn-close').addEventListener('click', () => window.close());

  // --- Variablen ---
  let pc, localStream;
  const room = "GSMR";
  const ws = new WebSocket("https://gsmr-funk.onrender.com");
  const btnAction = document.getElementById('btn-action');
  const talkSound = new Audio("Funken.wav");
  let someoneTalking = false; // globaler Talk-Zustand

  // --- Neuverhandlung ---
  async function renegotiate() {
    if (!pc) return;
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    ws.send(JSON.stringify({ type: "signal", room, payload: { sdp: offer } }));
  }

  // --- Verbindung aufbauen ---
  async function startConnection() {
    pc = new RTCPeerConnection({ iceServers: [{ urls: "stun:stun.l.google.com:19302" }] });

    const remoteAudio = document.createElement("audio");
    remoteAudio.autoplay = true;
    pc.ontrack = e => remoteAudio.srcObject = e.streams[0];
    document.body.appendChild(remoteAudio);

    pc.onicecandidate = e => {
      if (e.candidate) ws.send(JSON.stringify({ type: "signal", room, payload: { candidate: e.candidate } }));
    };

    ws.onmessage = async (event) => {
      const msg = JSON.parse(event.data);
      console.log("📩 WS:", msg);

      // --- Signalisierung ---
      if (msg.type === "ready") {
        await renegotiate();
      }

      if (msg.type === "signal") {
        const { sdp, candidate } = msg.payload;
        if (sdp) {
          await pc.setRemoteDescription(new RTCSessionDescription(sdp));
          if (sdp.type === "offer") {
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
            ws.send(JSON.stringify({ type: "signal", room, payload: { sdp: answer } }));
          }
        } else if (candidate) {
          try { await pc.addIceCandidate(new RTCIceCandidate(candidate)); }
          catch (err) { console.error("❌ ICE:", err); }
        }
      }

      // --- Exklusives Sprechen ---
      if (msg.type === "talk_start" && msg.room === room) {
        someoneTalking = true;
        btnAction.disabled = true;
        btnAction.textContent = "🚫 besetzt";
      }

      if (msg.type === "talk_end" && msg.room === room) {
        someoneTalking = false;
        btnAction.disabled = false;
        btnAction.textContent = "🎙️";
      }
    };

    ws.onopen = () => {
      console.log("🌐 WebSocket verbunden");
      ws.send(JSON.stringify({ type: "join", room }));
    };

    ws.onerror = (e) => console.error("⚠️ WS-Fehler:", e);

    // Audio vorbereiten
    localStream = await navigator.mediaDevices.getUserMedia({
      audio: { noiseSuppression: true, echoCancellation: true, autoGainControl: true }
    });

    console.log("🎤 Mikrofon bereit.");
  }

  startConnection();

  // --- Push-to-Talk ---
  async function startTalking() {
    if (someoneTalking) return; // blockieren, falls jemand anderes spricht
    talkSound.currentTime = 0;
    talkSound.play().catch(() => {}); // Sound beim Drücken
    ws.send(JSON.stringify({ type: "talk_start", room }));

    localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
    await renegotiate();
  }

  async function stopTalking() {
    ws.send(JSON.stringify({ type: "talk_end", room }));
    pc.getSenders().forEach(sender => {
      if (sender.track && sender.track.kind === 'audio') pc.removeTrack(sender);
    });
    await renegotiate();
  }

  // Maus
  btnAction.addEventListener('mousedown', startTalking);
  btnAction.addEventListener('mouseup', stopTalking);

  // Touch
  btnAction.addEventListener('touchstart', (e) => { e.preventDefault(); startTalking(); });
  btnAction.addEventListener('touchend', (e) => { e.preventDefault(); stopTalking(); });
</script>
</body>
</html>
